providers = ["java"]

[phases.setup]
nixPkgs = ["jdk17_headless"]

[phases.build]
cmds = ["cd backend && ./mvnw package -DskipTests"]

[start]
cmd = "java -Djava.net.preferIPv4Stack=true -Xmx256m -Xms64m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -jar backend/target/smartfoodfitness-0.0.1-SNAPSHOT.jar"

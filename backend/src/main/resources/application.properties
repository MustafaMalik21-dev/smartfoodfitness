spring.application.name=smartfoodfitness

# ── Database ─────────────────────────────────────────────────────────────────
# Local dev: set via application-local.properties (gitignored)
# Production: set SPRING_DATASOURCE_URL / USERNAME / PASSWORD as env vars in Railway
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartFoodFitnessDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartFoodFitnessUser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:User123}

# ── JPA ──────────────────────────────────────────────────────────────────────
# Hibernate still owns the schema, so the default must stay 'update' — new entity columns
# are created on boot. Once Flyway/Liquibase owns migrations, set SPRING_JPA_DDL_AUTO=validate
# in Railway so production stops mutating the live Supabase schema.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
# Disabled in production — enable locally via application-local.properties
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.forward-headers-strategy=native

# ── Memory optimisation (Railway 512 MB cap) ──────────────────────────────────
spring.main.lazy-initialization=true

# ── JWT — NO default; must be set as env var ─────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expirationSeconds=${APP_JWT_EXPIRATION_SECONDS:3600}

# ── USDA Food Data Central — NO default; set as env var ──────────────────────
usda.fdc.apiKey=${USDA_API_KEY}

# ── Wger Exercise API — NO default; set as env var ───────────────────────────
wger.base-url=${WGER_BASE_URL:https://wger.de/api/v2}
wger.api-key=${WGER_API_KEY}
wger.language-id=${WGER_LANGUAGE_ID:2}

wger.map.chest=${WGER_MAP_CHEST:pector,pec,bench,fly}
wger.map.back=${WGER_MAP_BACK:lat,back,row,pull,deadlift}
wger.map.shoulders=${WGER_MAP_SHOULDERS:deltoid,shoulder,overhead,lateral raise}
wger.map.arms=${WGER_MAP_ARMS:bicep,tricep,curl,dip,forearm}
wger.map.core=${WGER_MAP_CORE:abs,core,oblique,plank,crunch}
wger.map.legs=${WGER_MAP_LEGS:quad,hamstring,glute,calf,squat,lunge,leg}
wger.map.cardio=${WGER_MAP_CARDIO:cardio,run,running,bike,rowing,burpee,jump,sprint}

# ── Seeding ───────────────────────────────────────────────────────────────────
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.http=${APP_SEED_HTTP:false}

# ── Anthropic — NO default; set as env var ───────────────────────────────────
anthropic.api.key=${ANTHROPIC_API_KEY}
# Read timeout must cover a full max_tokens=2048 plan generation
anthropic.api.connectTimeoutMs=${ANTHROPIC_CONNECT_TIMEOUT_MS:8000}
anthropic.api.readTimeoutMs=${ANTHROPIC_READ_TIMEOUT_MS:60000}
